apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-service
  namespace: deploy-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-service-cluster-admin
subjects:
  - kind: ServiceAccount
    name: deploy-service
    namespace: deploy-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
